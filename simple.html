<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muzzammil Malick | Simple view</title>
    <meta
      name="description"
      content="Muzzammil Malick, software development student at Mohawk College looking for a summer 2027 co-op. Projects, experience, skills and contact details on one page."
    />
    <meta name="theme-color" content="#0a0a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The styles live here so this page is one small file that loads instantly. -->
    <style>
      :root {
        --bg: #0a0a08;
        --line: #2b2619;
        --amber: #ffb000;
        --amber-dim: #c2964a;
        --text: #ece6d8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2.5rem 1rem 4rem;
        color: var(--text);
        background: var(--bg);
        font: 1.0625rem/1.65 system-ui, sans-serif;
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        font-family: ui-monospace, Consolas, monospace;
      }
      h1 {
        margin: 0 0 0.5rem;
        color: var(--amber);
        font-size: clamp(2rem, 7vw, 2.75rem);
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.375rem;
      }
      h3 {
        margin: 0 0 0.25rem;
        color: var(--amber);
        font-size: 1.0625rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      a {
        color: var(--amber);
      }
      section {
        margin-top: 2.5rem;
        padding-top: 2rem;
        border-top: 1px solid var(--line);
      }
      section h2:not(:first-child) {
        margin-top: 2rem;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      .points {
        margin: 0.5rem 0 0.75rem;
        padding-left: 1.25rem;
      }
      ul.points {
        list-style: disc;
      }
      .stack > li {
        margin-bottom: 1.25rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        margin: 1rem 0;
      }
      .highlight {
        color: var(--amber);
      }
      .meta {
        color: var(--amber-dim);
        font-size: 0.9375rem;
      }
      .status {
        margin-left: 0.25rem;
        color: var(--amber-dim);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.8125rem;
        font-weight: 400;
      }
      /* Prints cleanly on white paper, for recruiters who print a copy. */
      @media print {
        :root {
          --bg: #fff;
          --line: #bbb;
          --amber: #000;
          --amber-dim: #444;
          --text: #000;
        }
      }
    </style>
  </head>
  <body>
    <!-- simple-page-content -->
  </body>
</html>
