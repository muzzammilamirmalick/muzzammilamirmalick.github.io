<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muzzammil Malick | Simple view</title>
    <meta
      name="description"
      content="Muzzammil Malick, software development student at Mohawk College looking for a May 2027 co-op. Projects, experience, skills and contact details on one page."
    />
    <meta name="theme-color" content="#0a0a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The styles live here so this page is one small file that loads instantly. -->
    <style>
      :root {
        --bg: #0a0a08;
        --line: #2b2619;
        --amber: #ffb000;
        --amber-dim: #c2964a;
        --text: #ece6d8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2.5rem 1rem 4rem;
        color: var(--text);
        background: var(--bg);
        font: 1.0625rem/1.65 system-ui, sans-serif;
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        font-family: ui-monospace, Consolas, monospace;
      }
      h1 {
        margin: 0 0 0.5rem;
        color: var(--amber);
        font-size: clamp(2rem, 7vw, 2.75rem);
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.375rem;
      }
      h3 {
        margin: 0 0 0.25rem;
        color: var(--amber);
        font-size: 1.0625rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      a {
        color: var(--amber);
      }
      section {
        margin-top: 2.5rem;
        padding-top: 2rem;
        border-top: 1px solid var(--line);
      }
      section h2:not(:first-child) {
        margin-top: 2rem;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      .points {
        margin: 0.5rem 0 0.75rem;
        padding-left: 1.25rem;
      }
      ul.points {
        list-style: disc;
      }
      .stack > li {
        margin-bottom: 1.25rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        margin: 1rem 0;
      }
      .highlight {
        color: var(--amber);
      }
      .meta {
        color: var(--amber-dim);
        font-size: 0.9375rem;
      }
      .status {
        margin-left: 0.25rem;
        color: var(--amber-dim);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.8125rem;
        font-weight: 400;
      }
      .project {
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .project > :last-child {
        margin-bottom: 0;
      }
      /* The old monitor look: a faint grid behind the page and scanlines over it. */
      .crt,
      .boot {
        display: none;
      }
      @media screen {
        body {
          background-image:
            linear-gradient(rgba(255, 176, 0, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 176, 0, 0.03) 1px, transparent 1px);
          background-size: 48px 48px;
        }
        .crt {
          position: fixed;
          inset: 0;
          z-index: 1;
          display: block;
          pointer-events: none;
          background: repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.2) 0 1px,
            transparent 1px 3px
          );
        }
      }
      /* All of the motion. It is skipped for reduced motion and printing. */
      @media screen and (prefers-reduced-motion: no-preference) {
        .crt {
          animation: flicker 5s ease-in-out infinite;
        }
        .boot {
          display: grid;
          justify-items: start;
          margin-bottom: 2rem;
          color: var(--amber);
          font: 0.875rem/1.6 ui-monospace, Consolas, monospace;
        }
        /* Each line grows one letter at a time. The right border is the cursor. */
        .boot-line {
          width: calc(var(--chars) * 1ch + 0.5em);
          overflow: hidden;
          white-space: pre;
          border-right: 0.5em solid transparent;
          animation:
            type 300ms var(--typing) calc(var(--line) * 350ms) backwards,
            cursor 350ms calc(var(--line) * 350ms);
        }
        .boot-line:last-child {
          animation:
            type 300ms var(--typing) calc(var(--line) * 350ms) backwards,
            blink 1s step-end calc(var(--line) * 350ms) infinite;
        }
        /* The real content appears once the last line has been typed. */
        header,
        section {
          animation: rise 450ms ease-out 1400ms backwards;
        }
        section:nth-child(n + 2) {
          animation-delay: 1500ms;
        }
        /* The script at the bottom of the page adds this when a heading scrolls into view. */
        h2.in-view {
          animation: heading 550ms steps(14) both;
        }
        .project {
          transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .project:hover {
          border-color: var(--amber-dim);
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
          transform: translateY(-3px);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      @keyframes type {
        from {
          width: 0;
        }
      }
      @keyframes cursor {
        from,
        to {
          border-color: var(--amber);
        }
      }
      @keyframes blink {
        0% {
          border-color: var(--amber);
        }
        50% {
          border-color: transparent;
        }
      }
      /* Slow and faint on purpose, so it is safe and the text stays easy to read. */
      @keyframes flicker {
        50% {
          opacity: 0.7;
        }
      }
      /* Types the heading in, with a small glitch at the end. */
      @keyframes heading {
        from {
          clip-path: inset(0 100% 0 0);
        }
        70% {
          clip-path: inset(0);
          text-shadow: -3px 0 var(--amber);
          transform: translateX(3px);
        }
        85% {
          text-shadow: 3px 0 var(--amber-dim);
          transform: translateX(-2px);
        }
        to {
          clip-path: inset(0);
        }
      }
      /* Prints cleanly on white paper, for recruiters who print a copy. */
      @media print {
        :root {
          --bg: #fff;
          --line: #bbb;
          --amber: #000;
          --amber-dim: #444;
          --text: #000;
        }
      }
    </style>
  </head>
  <body>
    <!-- simple-page-content -->
    <!-- The only script here. It plays each heading's animation once, after the boot lines. -->
    <script>
      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          entry.target.classList.add("in-view");
          observer.unobserve(entry.target);
        }
      });
      setTimeout(() => {
        document.querySelectorAll("h2").forEach((heading) => observer.observe(heading));
      }, 1400);
    </script>
  </body>
</html>
