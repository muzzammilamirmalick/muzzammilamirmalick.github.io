<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Team Operations Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one 16:9 operations screen. Header, then a 3-column grid (team | task board | assignments) under an aligned overview band (orders | priority | alerts). Below 1360px wide it becomes tabbed. */
:root{
  --bg:#eef1f3;--panel:#ffffff;--raised:#f4f6f8;--sunk:#e7ebee;--line:#dde3e7;--line-strong:#c4cdd3;
  --ink:#12181c;--ink-2:#46525a;--muted:#67747d;
  --focus:#2a78d6;--cc:#2a78d6;--del:#c94a7a;--ret:#71808a;
  --ok:#1d7a42;--ok-bg:#e2f2e8;--warn:#d99a00;--warn-ink:#845700;--warn-bg:#fbf1d3;--bad:#c3302a;--bad-bg:#fae4e2;--off:#8b969d;
  --btn:#12181c;--btn-ink:#ffffff;--scrim:rgba(10,14,17,.45);--track:#e5e9ec;--shift:#b5c0c7;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1013;--panel:#141a1e;--raised:#1a2126;--sunk:#0f1418;--line:#242d34;--line-strong:#34414b;
  --ink:#e8edf0;--ink-2:#b2bec5;--muted:#86939b;
  --focus:#6aa8ee;--cc:#3987e5;--del:#d55181;--ret:#8796a0;
  --ok:#5ccb8b;--ok-bg:rgba(92,203,139,.13);--warn:#f2c94c;--warn-ink:#f2c94c;--warn-bg:rgba(242,201,76,.13);--bad:#ff7b72;--bad-bg:rgba(255,123,114,.14);--off:#6d7a83;
  --btn:#e8edf0;--btn-ink:#0c1013;--scrim:rgba(0,0,0,.6);--track:#1d252b;--shift:#3d4a54;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1013;--panel:#141a1e;--raised:#1a2126;--sunk:#0f1418;--line:#242d34;--line-strong:#34414b;
  --ink:#e8edf0;--ink-2:#b2bec5;--muted:#86939b;
  --focus:#6aa8ee;--cc:#3987e5;--del:#d55181;--ret:#8796a0;
  --ok:#5ccb8b;--ok-bg:rgba(92,203,139,.13);--warn:#f2c94c;--warn-ink:#f2c94c;--warn-bg:rgba(242,201,76,.13);--bad:#ff7b72;--bad-bg:rgba(255,123,114,.14);--off:#6d7a83;
  --btn:#e8edf0;--btn-ink:#0c1013;--scrim:rgba(0,0,0,.6);--track:#1d252b;--shift:#3d4a54;color-scheme:dark}
html{box-sizing:border-box;font-size:16px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;gap:.7rem;padding-block:.7rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.brand .eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .date{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.05}
.clock{font-family:var(--f-display);font-weight:600;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chipline{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:baseline;gap:.35rem;padding:.25rem .65rem;border-radius:.4rem;background:var(--panel);border:1px solid var(--line);font-size:.88rem;color:var(--ink-2);white-space:nowrap}
.stat b{font-family:var(--f-display);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--muted);white-space:nowrap}
.sync i{width:.55rem;height:.55rem;border-radius:50%;background:var(--off)}
.sync.live i{background:var(--ok)}.sync.err{color:var(--bad)}.sync.err i{background:var(--bad)}.sync.busy i{background:var(--warn)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + .35rem);z-index:30;min-width:15rem;background:var(--panel);border:1px solid var(--line-strong);border-radius:.5rem;padding:.3rem;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;padding:.6rem .7rem;border-radius:.35rem;cursor:pointer;font-weight:700;font-size:.95rem}
.menu button:hover{background:var(--raised)}
.banner{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.5rem .85rem;border-radius:.5rem;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);font-size:.92rem}
.banner .ico{color:var(--warn-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.35rem;padding:0 .85rem;border-radius:.45rem;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-weight:700;font-size:.92rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:1.95rem;padding:0 .6rem;font-size:.84rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{border-color:var(--ok);color:var(--ok)}
.icon-btn{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:.4rem;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--raised);color:var(--ink)}

/* main grid */
.main{display:grid;gap:.7rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-h{display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:2.9rem}
.panel-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.panel-b{padding:.6rem .85rem;min-height:0}
.muted{color:var(--muted)}.small{font-size:.84rem}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;padding:1rem .2rem;color:var(--ink-2)}
.empty h3{margin:0;font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}
.empty p{margin:0;max-width:34rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:.35em;font-size:.8rem;font-weight:700;padding:.14em .55em;border-radius:99px;background:var(--raised);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:.5em;height:.5em;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.warn{color:var(--warn-ink);background:var(--warn-bg)}.pill.bad{color:var(--bad);background:var(--bad-bg)}.pill.off{color:var(--off)}
.pill.lg{font-size:.9rem}

/* orders */
.orders{display:grid;grid-template-columns:7.6rem minmax(0,1fr) minmax(0,1fr);gap:.9rem;align-items:center}
.pie{width:7.6rem;height:7.6rem;display:block}
.pie text{fill:var(--ink);font-family:var(--f-display)}
.ocat .lab{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:.88rem;color:var(--ink-2);white-space:nowrap}
.sw{width:.75rem;height:.75rem;border-radius:2px;flex:none}
.ocat .big{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;margin:.15rem 0 .25rem;font-variant-numeric:tabular-nums}
.ocat .big small{font-size:.95rem;font-weight:600;color:var(--muted);margin-left:.25rem}
.prog{height:.4rem;border-radius:99px;background:var(--track);position:relative;overflow:hidden}
.prog span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.prog .p1{opacity:.45}
.ocat .sub{font-size:.8rem;color:var(--muted);margin-top:.25rem;font-variant-numeric:tabular-nums}

/* recommendation */
.rec-head{font-family:var(--f-display);font-weight:600;font-size:1.55rem;line-height:1.15;margin:.1rem 0 .45rem;text-wrap:balance}
.rec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3rem}
.rec li{display:flex;gap:.5rem;font-size:.95rem;color:var(--ink-2)}
.rec li::before{content:"";width:.35rem;height:.35rem;border-radius:50%;background:var(--muted);flex:none;margin-top:.5em}
.rec .foot{font-size:.76rem;color:var(--muted);margin-top:.45rem}

/* alerts */
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:.5rem;align-items:start;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.al:last-child{border-bottom:0}
.al .ico{margin-top:.12rem}
.al.s3 .ico{color:var(--bad)}.al.s2 .ico{color:var(--warn-ink)}.al.s1 .ico{color:var(--muted)}
.al.s3 .t{font-weight:700}

/* team */
.counts{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.counts b{font-family:var(--f-display);font-size:1.1rem;color:var(--ink);margin-right:.15rem}
.strip{padding:.35rem .2rem .2rem calc(2rem + .5rem + 6.4rem + .5rem + .2rem);padding-right:calc(8.8rem + .5rem + .2rem)}
.strip-axis{position:relative;height:1rem;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.strip-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.strip-load{position:relative;height:1.5rem;display:flex;align-items:flex-end;gap:1px;border-bottom:1px solid var(--line-strong)}
.strip-load i{flex:1;background:var(--warn);opacity:.75;min-height:0;border-radius:1px 1px 0 0}
.strip-load i.low{background:var(--bad);opacity:.9}
.strip-cap{display:flex;justify-content:space-between;gap:.5rem;font-size:.72rem;color:var(--muted);margin-top:.15rem;white-space:nowrap}
.emp{display:grid;grid-template-columns:2rem minmax(0,1fr) 8.8rem;gap:.1rem .5rem;align-items:center;padding:.4rem .2rem;border-bottom:1px solid var(--line)}
.emp:last-child{border-bottom:0}
.emp input[type=checkbox]{width:1.35rem;height:1.35rem;margin:0 0 0 .3rem;accent-color:var(--ok);cursor:pointer}
.emp-l1{display:flex;align-items:center;gap:.5rem;min-width:0}
.emp-name{font-weight:700;font-size:1.06rem;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left;color:var(--ink)}
.emp-name:hover{text-decoration:underline}
.n-absent{color:var(--bad)!important}.n-break{color:var(--warn-ink)!important}.n-off{color:var(--off)!important}
.emp-act{display:flex;flex-direction:column;align-items:stretch;gap:.2rem}.emp-act .bk{font-size:.78rem;color:var(--muted);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.bk .timer{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--warn-ink)}
.bk.over .timer,.bk .over{color:var(--bad)}
.emp-l2{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:.5rem;align-items:center;margin-top:.15rem}
.shift-t{font-family:var(--f-display);font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{position:relative;height:.75rem;background:var(--track);border-radius:99px;overflow:hidden}
.tl .sh{position:absolute;top:0;bottom:0;background:var(--shift);border-radius:99px}
.tl .bp{position:absolute;top:0;bottom:0;border:2px solid var(--warn);border-radius:3px;background:var(--warn-bg)}
.tl .bt{position:absolute;top:0;bottom:0;background:var(--warn);border-radius:3px;opacity:.55}
.tl .bo{position:absolute;top:0;bottom:0;background:var(--warn);border-radius:3px}
.tl .nw{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.8}
.emp-act .btn{width:100%}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--raised);border-radius:.5rem;border:2px solid transparent}
.col.drop{border-color:var(--focus)}
.col-h{padding:.55rem .65rem .4rem;display:flex;flex-direction:column;gap:.35rem}
.col-t{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.98rem}
.col-t .name{min-width:0;line-height:1.15}
.col-t .cnt{margin-left:auto;font-family:var(--f-display);font-size:1rem;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 .5rem;font-variant-numeric:tabular-nums}
.col-p{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.col-p .prog{flex:1}
.col-team{font-size:.8rem;color:var(--ink-2);line-height:1.3}
.col-team b{font-weight:700;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.col-list{flex:1;min-height:0;overflow:auto;padding:.1rem .45rem .5rem;display:flex;flex-direction:column;gap:.4rem}
.col-empty{font-size:.85rem;color:var(--muted);padding:.6rem .3rem;border:1px dashed var(--line-strong);border-radius:.4rem;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.45rem;padding:.48rem .6rem;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.card:hover{border-color:var(--line-strong)}
.card.s-done{opacity:.6;background:var(--sunk)}
.card.drag-src{opacity:.3}
.card.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:.95;margin:0}
.card-l1{display:flex;gap:.4rem;align-items:flex-start}
.card-title{font-weight:700;font-size:.95rem;min-width:0;overflow-wrap:anywhere;flex:1}
.s-done .card-title{text-decoration:line-through;text-decoration-thickness:1px}
.tchip{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.1em .45em;border-radius:.3rem;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.card-l2{display:flex;align-items:center;gap:.45rem;margin-top:.3rem;font-size:.82rem;color:var(--ink-2);min-width:0}
.card-l2 .own{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-l1 .btn{margin-left:auto;flex:none;margin-top:-.15rem}.card-l2 .tchip{margin-left:auto}
.card-note{font-size:.8rem;color:var(--muted);margin-top:.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio{display:inline-flex;align-items:center;gap:.2rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}
.st svg{width:.95em;height:.95em}
.s-done .st{color:var(--ok)}
.sdot{width:.55rem;height:.55rem;border-radius:50%;display:inline-block;flex:none}
.sd-available{background:var(--ok)}.sd-break,.sd-over{background:var(--warn)}.sd-absent,.sd-notyet{background:var(--bad)}.sd-off{background:var(--off)}

/* assignments */
.lockstate{margin-left:auto}
.as-form{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;padding:.6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--raised);margin-bottom:.7rem}
.as-form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:.2rem;font-size:.8rem;font-weight:700;color:var(--ink-2);min-width:0}
.fld input,.fld select,.fld textarea{font-weight:400;font-size:.98rem;padding:.42rem .5rem;border-radius:.4rem;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);min-width:0;width:100%}
.fld textarea{resize:vertical;min-height:4rem}
.fld .hint{font-weight:400;color:var(--muted);font-size:.78rem}
.ferr{color:var(--bad);font-size:.85rem;font-weight:700;margin:0}
.fwarn{color:var(--warn-ink);background:var(--warn-bg);border-radius:.4rem;padding:.45rem .6rem;font-size:.86rem;margin:0}
.fok{color:var(--ok);font-size:.85rem;margin:0}
.as-g{padding:.55rem 0;border-bottom:1px solid var(--line)}
.as-g:last-child{border-bottom:0}
.as-gh{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.98rem;margin-bottom:.35rem}
.as-row{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:.5rem;align-items:start;margin:.3rem 0}
.as-lab{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .5rem;border-radius:.4rem;background:var(--raised);border:1px solid var(--line);font-size:.9rem;font-weight:700;max-width:100%}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.chip button:hover{color:var(--ink)}
.none{font-size:.85rem;color:var(--muted);padding-top:.22rem}
.as-warn{font-size:.82rem;color:var(--warn-ink);margin-top:.25rem;display:flex;gap:.35rem;align-items:flex-start}

/* tabs (narrow) */
.tabs{display:none;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;padding:.25rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs button{flex:1;border:0;background:none;padding:.55rem .3rem;border-radius:.4rem;font-weight:700;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-selected=true]{background:var(--btn);color:var(--btn-ink)}

/* dialogs */
dialog{border:1px solid var(--line-strong);border-radius:.7rem;padding:0;background:var(--panel);color:var(--ink);width:min(36rem,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog.wide{width:min(52rem,calc(100vw - 32px))}
dialog::backdrop{background:var(--scrim)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-h{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-family:var(--f-display);font-size:1.35rem;flex:1}
.dlg-b{padding:1rem;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.dlg-f{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;padding:.75rem 1rem;border-top:1px solid var(--line)}
.dlg-f .left{margin-right:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:.45rem;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:.45rem .9rem;font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.stepper{display:flex;align-items:stretch}
.stepper input{text-align:center;border-radius:0!important;font-family:var(--f-display);font-size:1.15rem!important;font-variant-numeric:tabular-nums}
.stepper button{width:2.2rem;border:1px solid var(--line-strong);background:var(--raised);cursor:pointer;font-weight:700;font-size:1.1rem}
.stepper button:first-child{border-radius:.4rem 0 0 .4rem;border-right:0}
.stepper button:last-child{border-radius:0 .4rem .4rem 0;border-left:0}
.sect{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.2rem 0 -.2rem}
.box{border:1px solid var(--line);border-radius:.5rem;padding:.7rem;display:flex;flex-direction:column;gap:.55rem}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.bigchoice .btn{min-height:4rem;font-size:1.15rem;flex-direction:column;gap:.1rem}
.bigchoice .btn small{font-weight:400;font-size:.78rem;color:inherit;opacity:.75}
.pin-dots{display:flex;gap:.7rem;justify-content:center;margin:.3rem 0}
.pin-dots i{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--line-strong)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;max-width:18rem;margin:0 auto;width:100%}
.keypad button{min-height:3.2rem;font-size:1.35rem;font-family:var(--f-display);font-weight:700;border-radius:.5rem;border:1px solid var(--line-strong);background:var(--raised);cursor:pointer}
.pin-in{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
pre.ho{white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;background:var(--raised);border:1px solid var(--line);border-radius:.5rem;padding:.8rem;margin:0;max-height:50vh;overflow:auto}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:grid;grid-template-columns:4rem 1fr;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.loglist time{color:var(--muted);font-variant-numeric:tabular-nums}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem;z-index:60;max-width:min(26rem,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:.7rem;background:var(--btn);color:var(--btn-ink);padding:.65rem .85rem;border-radius:.5rem;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.warn{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.toast.err{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:.35rem;padding:.15rem .5rem;font-weight:700;cursor:pointer}

/* wide screens: everything on one screen */
@media (min-width:1360px) and (min-height:600px){
  html{font-size:clamp(12.5px,min(.88vw,1.58vh),40px)}
  html,body{height:100%}
  body{overflow:hidden}
  #app{height:100%}
  .main{flex:1;min-height:0;grid-template-columns:33rem minmax(0,1fr) 21rem;grid-template-rows:11.6rem minmax(0,1fr);
    grid-template-areas:"orders rec alerts" "team board assign"}
  #p-orders{grid-area:orders}#p-rec{grid-area:rec}#p-alerts{grid-area:alerts}#p-team{grid-area:team}#p-board{grid-area:board}#p-assign{grid-area:assign}
  .panel{overflow:hidden}
  .panel-b{flex:1;overflow:auto}
  #p-board .panel-b{display:flex;flex-direction:column;overflow:hidden}
  .board{flex:1}
  #p-team .panel-b{padding-top:.2rem}
}
/* narrow: tabs */
@media not all and (min-width:1360px) and (min-height:600px){
  .tabs{display:flex}
  .main [data-tab]{display:none}
  body[data-view=overview] .main [data-tab=overview],body[data-view=team] .main [data-tab=team],body[data-view=tasks] .main [data-tab=tasks],body[data-view=assign] .main [data-tab=assign]{display:flex}
  .top .clock{font-size:1.6rem}
  .col-list{max-height:none}
}
@media (max-width:900px){.board{grid-template-columns:1fr}.orders{grid-template-columns:6.5rem 1fr 1fr}.pie{width:6.5rem;height:6.5rem}}
@media (max-width:560px){
  .top{gap:.6rem}.top .stat{display:none}
  .orders{grid-template-columns:1fr 1fr}.orders .pie{grid-column:1/-1;margin:0 auto}
  .grid2,.grid3{grid-template-columns:1fr}
  .emp{grid-template-columns:2rem minmax(0,1fr) 6.2rem}
  .strip{display:none}
  .emp-l2{grid-template-columns:5.6rem minmax(0,1fr)}
  .tbtn-label{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.card,.chip{transition:background-color .12s,border-color .12s}}

/* ================= state ================= */
function defaultDay(date) { return { date: date, shiftLabel: '', cutoff: '', orders: { cc: { total: 0, picked: 0, checked: 0 }, del: { total: 0, picked: 0, checked: 0 } }, acks: {}, note: '' }; }

/* ================= storage backends ================= */
function LocalBackend() {

function SharedBackend(db) {
  var docs = {}, onChange = function () {}, seen = {}, readyFired = false;
  var DOCS = ['ops/day', 'ops/config', 'ops/security'];
  var COLS = [['staff'], ['roster'], ['tasks'], ['assign'], ['log', function (q) { return q.orderBy('ts', 'desc').limit(250); }], ['history', function (q) { return q.orderBy('savedAt', 'desc').limit(60); }]];

  };

function applyDocs(docs) {
  var day = docs['ops/day'];
  S.dayExists = !!day;
  S.day = withDefaults(defaultDay(todayKey()), day);

function stamp(o) { o.by = DEVICE.name; o.at = Date.now(); return o; }
function write(op, path, data) {

  });
  function begin() {
    var t = S.tasks[drag.id]; if (!t) return cancel();
    if (!isUnlocked()) { toast('Unlock with the PIN to move tasks between categories.', 'warn'); return cancel(); }
    if (t.status === 'done') { toast('Completed tasks can’t be moved. Reopen the task first.', 'warn'); return cancel(); }

    var r = drag.card.getBoundingClientRect(), g = drag.card.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';

  function cancel() { if (drag) { clearTimeout(drag.timer); if (drag.ghost) drag.ghost.remove(); if (drag.card) drag.card.classList.remove('drag-src'); $$('.col.drop').forEach(function (k) { k.classList.remove('drop'); }); } var was = drag && drag.active; drag = null; deferRender = false; if (was) scheduleRender(); }

    e.preventDefault(); move(e.clientX, e.clientY);
