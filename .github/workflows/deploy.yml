# Builds the site and publishes it to GitHub Pages.
# It only runs by hand for now, so pushing keeps a backup without the site going live.
# To publish on every push instead, add this under "on:":
#   push:
#     branches: [main]
name: Deploy to GitHub Pages

on:
  # Adds a "Run workflow" button on the GitHub Actions tab, for deploying by hand.
  workflow_dispatch:

# The permissions GitHub Pages needs to publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, only the newest version gets deployed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
